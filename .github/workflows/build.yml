name: Build

# Single workflow that builds the native libraries and the server (Paperclip) jar
# together, then publishes ONE combined GitHub Release.
#
# Packaging policy:
#   - Three primary desktop platforms are bundled INTO the jar under
#     META-INF/native/<platform>/ : linux-x86_64, windows-x86_64, macos-aarch64.
#     (Gradle only emits the local linux build; the windows + macos libs are
#     injected into the jar by the CI after compilation, without touching gradle.)
#   - The other five platforms are published as standalone assets in the SAME
#     release (not bundled into the jar): linux-aarch64, windows-aarch64,
#     macos-x86_64, freebsd-x86_64, freebsd-aarch64.
#
# All artifacts (jar + the five standalone natives) ship in one release.

on:
  push:
    paths:
      - '**/*.java'
      - '**/*.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'build-data/**'
      - 'scripts/**'
      - 'paper-server/**'
      - 'purpur-server/**'
      - 'lattice-api/**'
      - 'lattice-server/**'
      - 'lattice-native/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '**/*.java'
      - '**/*.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'build-data/**'
      - 'scripts/**'
      - 'paper-server/**'
      - 'purpur-server/**'
      - 'lattice-api/**'
      - 'lattice-server/**'
      - 'lattice-native/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the combined GitHub Release (also implied on push to the default branch)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Native: build all eight platform libraries. Each uploads a canonical asset
  # (<name> + <name>.sha256) consumed by the build (windows/macos -> jar) and
  # publish (the five remaining platforms -> release) jobs.
  # ---------------------------------------------------------------------------
  native:
    name: native-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    outputs:
      native_commit: ${{ steps.native_commit.outputs.value }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04, os: linux, arch: x86_64, artifact_path: lattice-native/build/liblattice.so, asset_name: lattice-native-linux-x86_64.so }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, os: linux, arch: aarch64, artifact_path: lattice-native/build/liblattice.so, asset_name: lattice-native-linux-aarch64.so }
          - { name: windows-x86_64, runner: windows-2025, os: windows, arch: x86_64, llvm_mingw_host: x86_64, llvm_mingw_target: x86_64-w64-mingw32, llvm_mingw_sha256: b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35, asset_name: lattice-native-windows-x86_64.dll }
          - { name: windows-aarch64, runner: windows-11-arm, os: windows, arch: aarch64, llvm_mingw_host: aarch64, llvm_mingw_target: aarch64-w64-mingw32, llvm_mingw_sha256: 312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba, asset_name: lattice-native-windows-aarch64.dll }
          - { name: macos-x86_64, runner: macos-15-intel, os: macos, arch: x86_64, artifact_path: lattice-native/build/liblattice.dylib, asset_name: lattice-native-macos-x86_64.dylib }
          - { name: macos-aarch64, runner: macos-15, os: macos, arch: aarch64, artifact_path: lattice-native/build/liblattice.dylib, asset_name: lattice-native-macos-aarch64.dylib }
          - { name: freebsd-x86_64, runner: ubuntu-24.04, os: freebsd, arch: x86_64, artifact_path: lattice-native/build/liblattice.so, asset_name: lattice-native-freebsd-x86_64.so }
          - { name: freebsd-aarch64, runner: ubuntu-24.04, os: freebsd, arch: aarch64, artifact_path: lattice-native/build/liblattice.so, asset_name: lattice-native-freebsd-aarch64.so }

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve native source commit
        id: native_commit
        shell: bash
        run: echo "value=$(git log -1 --format=%H -- lattice-native)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: matrix.os != 'freebsd'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.arch == 'aarch64' && 'aarch64' || 'x64' }}

      - name: Set up CMake
        if: matrix.os != 'freebsd'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.28.3'

      - name: Cache LLVM-MinGW
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/llvm-mingw/20260616/${{ matrix.llvm_mingw_host }}
          key: llvm-mingw-20260616-ucrt-${{ matrix.llvm_mingw_host }}

      - name: Set up LLVM-MinGW
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: '20260616'
          LLVM_MINGW_HOST: ${{ matrix.llvm_mingw_host }}
          LLVM_MINGW_TARGET: ${{ matrix.llvm_mingw_target }}
          LLVM_MINGW_SHA256: ${{ matrix.llvm_mingw_sha256 }}
        run: |
          $installRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-mingw/$env:LLVM_MINGW_VERSION/$env:LLVM_MINGW_HOST"
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot 'bin'))) {
            $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_HOST.zip"
            $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_HOST"
            $assetName = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-$env:LLVM_MINGW_HOST.zip"
            $downloadUrl = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$assetName"
            Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
            $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $env:LLVM_MINGW_SHA256) {
              throw "LLVM-MinGW SHA-256 mismatch: expected $env:LLVM_MINGW_SHA256, got $actualHash"
            }
            Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
            $extractedRoots = @(Get-ChildItem -LiteralPath $extractRoot -Directory | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'bin') })
            if ($extractedRoots.Count -ne 1) {
              throw "Expected one LLVM-MinGW root directory, found $($extractedRoots.Count)"
            }
            Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path (Split-Path -Parent $installRoot) -Force | Out-Null
            Move-Item -LiteralPath $extractedRoots[0].FullName -Destination $installRoot
          }
          $binPath = Join-Path $installRoot 'bin'
          $compiler = Join-Path $binPath "$($env:LLVM_MINGW_TARGET)-clang++.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Missing LLVM-MinGW compiler: $compiler"
          }
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'LLVM-MinGW compiler smoke test failed' }
          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_MINGW_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_MINGW_TARGET=$env:LLVM_MINGW_TARGET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Windows ARM64 Java architecture
        if: matrix.os == 'windows' && matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $arch = (& java -XshowSettings:properties -version 2>&1 | Select-String 'os.arch').ToString()
          if ($arch -notmatch '(?i)(aarch64|arm64)') { throw "Expected ARM64 Java, got: $arch" }

      - name: Install Linux toolchain
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build clang lld

      - name: Configure and build Unix native
        if: matrix.os == 'linux' || matrix.os == 'macos'
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          cmake -S lattice-native -B lattice-native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLATTICE_WARNINGS_AS_ERRORS=ON -DLATTICE_BUILD_TESTS=ON
          cmake --build lattice-native/build --parallel
          ctest --test-dir lattice-native/build --output-on-failure
          file_output="$(file -L "${{ matrix.artifact_path }}")"
          printf '%s\n' "$file_output"
          if [[ '${{ matrix.arch }}' == 'x86_64' ]]; then
            grep -Eqi '(x86[-_ ]64|x86-64)' <<<"$file_output"
          else
            grep -Eqi '(aarch64|arm64)' <<<"$file_output"
          fi

      - name: Configure and build Windows native
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $binPath = Join-Path $env:LLVM_MINGW_ROOT 'bin'
          $cCompiler = (Join-Path $binPath "$($env:LLVM_MINGW_TARGET)-clang.exe").Replace('\', '/')
          $cxxCompiler = (Join-Path $binPath "$($env:LLVM_MINGW_TARGET)-clang++.exe").Replace('\', '/')
          $rcCompiler = (Join-Path $binPath "$($env:LLVM_MINGW_TARGET)-windres.exe").Replace('\', '/')
          $configureArgs = @(
            '-S', 'lattice-native',
            '-B', 'lattice-native/build-windows',
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}",
            "-DCMAKE_C_COMPILER=$cCompiler",
            "-DCMAKE_CXX_COMPILER=$cxxCompiler",
            "-DCMAKE_RC_COMPILER=$rcCompiler",
            '-DLATTICE_WARNINGS_AS_ERRORS=ON',
            '-DLATTICE_BUILD_TESTS=ON'
          )
          & cmake @configureArgs
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          & cmake --build lattice-native/build-windows --parallel
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
          & ctest --test-dir lattice-native/build-windows --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed' }
          $artifacts = @(Get-ChildItem -LiteralPath 'lattice-native/build-windows' -Recurse -File -Filter '*lattice*.dll')
          if ($artifacts.Count -ne 1) {
            Get-ChildItem -LiteralPath 'lattice-native/build-windows' -Recurse -File -Filter '*.dll' | Select-Object -ExpandProperty FullName
            throw "Expected exactly one Lattice DLL, found $($artifacts.Count)"
          }
          $artifactPath = $artifacts[0].FullName
          "WINDOWS_ARTIFACT_PATH=$artifactPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $readObj = Join-Path $binPath 'llvm-readobj.exe'
          $headers = & $readObj --file-headers $artifactPath 2>&1
          if ($LASTEXITCODE -ne 0) { throw "llvm-readobj failed for $artifactPath" }
          $headers
          $headerText = $headers -join "`n"
          if ('${{ matrix.arch }}' -eq 'x86_64') {
            if ($headerText -notmatch 'IMAGE_FILE_MACHINE_AMD64') { throw 'Expected x64 PE library' }
          } elseif ($headerText -notmatch 'IMAGE_FILE_MACHINE_ARM64') {
            throw 'Expected ARM64 PE library'
          }

      - name: Build in FreeBSD VM
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@5d765136e46232e8764d505d6b57e123f2ba7f45
        with:
          release: '14.4'
          arch: ${{ matrix.arch == 'aarch64' && 'aarch64' || 'amd64' }}
          usesh: true
          sync: rsync
          # Cache FreeBSD packages after provisioning; cache invalidates when this setup changes.
          prepare: |
            pkg install -y cmake ninja git openjdk21 pkgconf libdeflate file
          cache-after-prepare: true
          run: |
            set -eux
            if [ '${{ matrix.arch }}' = 'x86_64' ]; then
              test "$(uname -m)" = 'amd64'
              build_tests=ON
            else
              case "$(uname -m)" in
                aarch64|arm64) ;;
                *) echo "Expected FreeBSD ARM64, got $(uname -m)" >&2; exit 1 ;;
              esac
              # Linux ARM covers native/NEON tests; this VM verifies FreeBSD ARM ABI and build output.
              build_tests=OFF
            fi
            export JAVA_HOME=/usr/local/openjdk21
            test -f "$JAVA_HOME/include/jni.h"
            test -f "$JAVA_HOME/include/freebsd/jni_md.h"
            cmake -S lattice-native -B lattice-native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLATTICE_WARNINGS_AS_ERRORS=ON -DLATTICE_BUILD_TESTS="$build_tests"
            cmake --build lattice-native/build --parallel
            if [ "$build_tests" = 'ON' ]; then
              ctest --test-dir lattice-native/build --output-on-failure
            fi
            file_output="$(file -L '${{ matrix.artifact_path }}')"
            printf '%s\n' "$file_output"
            if [ '${{ matrix.arch }}' = 'x86_64' ]; then
              printf '%s\n' "$file_output" | grep -Eqi '(x86[-_ ]64|x86-64)'
            else
              printf '%s\n' "$file_output" | grep -Eqi '(aarch64|arm64)'
            fi

      - name: Stage canonical release asset (Unix)
        if: matrix.os != 'windows'
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          SOURCE_PATH: ${{ matrix.artifact_path }}
        run: |
          set -euo pipefail
          staging_dir="$RUNNER_TEMP/lattice-native-release"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"
          cp -L "$SOURCE_PATH" "$staging_dir/$ASSET_NAME"
          (cd "$staging_dir" && sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256")

      - name: Stage canonical release asset (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          SOURCE_PATH: ${{ env.WINDOWS_ARTIFACT_PATH }}
        run: |
          $stagingDir = Join-Path $env:RUNNER_TEMP 'lattice-native-release'
          Remove-Item -LiteralPath $stagingDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stagingDir | Out-Null
          $assetPath = Join-Path $stagingDir $env:ASSET_NAME
          Copy-Item -LiteralPath $env:SOURCE_PATH -Destination $assetPath
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:ASSET_NAME)" | Set-Content -LiteralPath "$assetPath.sha256" -NoNewline

      - name: Upload canonical release artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-publish-${{ matrix.name }}
          path: ${{ runner.temp }}/lattice-native-release
          if-no-files-found: error
          overwrite: true

  # ---------------------------------------------------------------------------
  # Build: compile the server, produce the Paperclip jar (with the local linux
  # native bundled by Gradle), then inject the windows + macos natives into the
  # jar so all three primary platforms ship inside it.
  # ---------------------------------------------------------------------------
  build:
    needs: native
    runs-on: ubuntu-latest
    outputs:
      mc_version: ${{ steps.stage.outputs.mc_version }}
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
      asset_name: ${{ steps.stage.outputs.asset_name }}
      checksum_name: ${{ steps.stage.outputs.checksum_name }}
    env:
      GIT_AUTHOR_NAME: GitHub Actions
      GIT_AUTHOR_EMAIL: actions@github.com
      GIT_COMMITTER_NAME: GitHub Actions
      GIT_COMMITTER_EMAIL: actions@github.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential
          cmake_version="$(cmake --version | awk 'NR == 1 { print $3 }')"
          if ! printf '%s\n%s\n' '3.20' "$cmake_version" | sort -C -V; then
            echo "CMake 3.20 or newer is required; found $cmake_version" >&2
            exit 1
          fi
          git --version
          java --version
          cmake --version
          ninja --version
          g++ --version
          printf '%s\n' 'int main() { return 0; }' | g++ -std=c++20 -x c++ -fsyntax-only -
      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git config --global init.defaultBranch main
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Apply patches
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew applyAllPatches --no-parallel --stacktrace
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew build --stacktrace
      - name: Build reobf Paperclip jar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :lattice-server:createMojmapPaperclipJar --stacktrace

      - name: Download windows native for jar bundling
        uses: actions/download-artifact@v4
        with:
          name: native-publish-windows-x86_64
          path: ${{ runner.temp }}/lattice-jar-natives
      - name: Download macos native for jar bundling
        uses: actions/download-artifact@v4
        with:
          name: native-publish-macos-aarch64
          path: ${{ runner.temp }}/lattice-jar-natives

      - name: Bundle primary-platform natives into Paperclip jar
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          paperclip="$(find lattice-server/build -type f -name '*paperclip*.jar' -print0 | head -z -n1 | tr -d '\0')"
          if [[ -z "$paperclip" ]]; then
            echo "Paperclip jar not found under lattice-server/build" >&2
            exit 1
          fi
          echo "Target jar: $paperclip"

          native_src="${{ runner.temp }}/lattice-jar-natives"
          stuff_dir="$RUNNER_TEMP/lattice-native-stuff"
          rm -rf "$stuff_dir"
          mkdir -p "$stuff_dir/META-INF/native/windows-x86_64" "$stuff_dir/META-INF/native/macos-aarch64"

          win_src="$native_src/lattice-native-windows-x86_64.dll"
          mac_src="$native_src/lattice-native-macos-aarch64.dylib"
          if [[ ! -f "$win_src" || ! -f "$mac_src" ]]; then
            echo "Missing windows/macos native artifacts for jar bundling" >&2
            exit 1
          fi
          cp -L "$win_src" "$stuff_dir/META-INF/native/windows-x86_64/lattice.dll"
          cp -L "$mac_src" "$stuff_dir/META-INF/native/macos-aarch64/liblattice.dylib"

          jar uf "$paperclip" \
            -C "$stuff_dir" META-INF/native/windows-x86_64/lattice.dll \
            -C "$stuff_dir" META-INF/native/macos-aarch64/liblattice.dylib

          echo "Bundled native entries:"; jar tf "$paperclip" | grep -E 'META-INF/native/'

      - name: Stage release assets
        id: stage
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if ! mc_version="$(./gradlew -q printMinecraftVersion)"; then
            echo "Failed to determine Minecraft version" >&2
            exit 1
          fi
          if [[ -z "$mc_version" || ! "$mc_version" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Unsafe or empty Minecraft version: $mc_version" >&2
            exit 1
          fi

          if [[ ! -d lattice-server/build ]]; then
            echo "Missing lattice-server/build directory" >&2
            exit 1
          fi
          candidates_file="$(mktemp)"
          trap 'rm -f "$candidates_file"' EXIT
          if ! find lattice-server/build -type f -name '*paperclip*.jar' -print0 > "$candidates_file"; then
            echo "Failed to search for Paperclip jar" >&2
            exit 1
          fi
          mapfile -d '' -t candidates < "$candidates_file"
          if (( ${#candidates[@]} != 1 )); then
            echo "Expected exactly one Paperclip jar, found ${#candidates[@]}" >&2
            printf '%s\n' "${candidates[@]}" >&2
            exit 1
          fi

          staging_dir="$RUNNER_TEMP/lattice-release"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"
          asset_name="lattice-${mc_version}-b${BUILD_NUMBER}.jar"
          asset_path="$staging_dir/$asset_name"
          checksum_name="${asset_name}.sha256"
          checksum_path="$staging_dir/$checksum_name"
          artifact_name="lattice-${mc_version}-b${BUILD_NUMBER}"
          cp -- "${candidates[0]}" "$asset_path"
          (cd "$staging_dir" && sha256sum "$asset_name" > "$checksum_name")

          {
            echo "mc_version=$mc_version"
            echo "artifact_name=$artifact_name"
            echo "asset_name=$asset_name"
            echo "checksum_name=$checksum_name"
            echo "staging_dir=$staging_dir"
          } >> "$GITHUB_OUTPUT"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ steps.stage.outputs.staging_dir }}
          if-no-files-found: error
          overwrite: true

  # ---------------------------------------------------------------------------
  # Publish: ONE combined release holding the jar (with the three primary natives
  # inside) plus the five standalone native libraries.
  # ---------------------------------------------------------------------------
  publish:
    needs: [build, native]
    if: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Download standalone native artifacts
        uses: actions/download-artifact@v4
        with:
          # The three primary platforms are already inside the jar; only the
          # five remaining platforms are published standalone here. Download all
          # native artifacts (wildcard) and publish only the five below.
          pattern: native-publish-*
          path: release-assets/native
          merge-multiple: true

      - name: Validate standalone native assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            lattice-native-linux-aarch64.so lattice-native-linux-aarch64.so.sha256
            lattice-native-windows-aarch64.dll lattice-native-windows-aarch64.dll.sha256
            lattice-native-macos-x86_64.dylib lattice-native-macos-x86_64.dylib.sha256
            lattice-native-freebsd-x86_64.so lattice-native-freebsd-x86_64.so.sha256
            lattice-native-freebsd-aarch64.so lattice-native-freebsd-aarch64.so.sha256
          )
          for asset in "${expected[@]}"; do
            if [[ ! -f "release-assets/native/$asset" ]]; then
              echo "Missing standalone native asset: $asset" >&2
              exit 1
            fi
          done
          for asset in "${expected[@]}"; do
            case "$asset" in
              *.sha256) continue ;;
            esac
            (cd release-assets/native && sha256sum --check --status "$asset.sha256") \
              || { echo "Checksum mismatch: $asset" >&2; exit 1; }
          done

      - name: Publish combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.mc_version }}-b${{ github.run_number }}
          name: 'Lattice ${{ needs.build.outputs.mc_version }} · Build #${{ github.run_number }}'
          files: |
            release-assets/${{ needs.build.outputs.asset_name }}
            release-assets/${{ needs.build.outputs.checksum_name }}
            release-assets/native/lattice-native-linux-aarch64.so
            release-assets/native/lattice-native-linux-aarch64.so.sha256
            release-assets/native/lattice-native-windows-aarch64.dll
            release-assets/native/lattice-native-windows-aarch64.dll.sha256
            release-assets/native/lattice-native-macos-x86_64.dylib
            release-assets/native/lattice-native-macos-x86_64.dylib.sha256
