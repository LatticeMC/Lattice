name: Build
on: [ push, pull_request ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Fix mixin repository
        run: |
          if ! grep -q "repo.spongepowered.org" tentacles-server/build.gradle.kts; then
            sed -i 's|dependencies {|repositories { maven("https://repo.spongepowered.org/repository/maven-public/") }\ndependencies {|' tentacles-server/build.gradle.kts
          fi
      - name: Build
        run: ./gradlew build --stacktrace
