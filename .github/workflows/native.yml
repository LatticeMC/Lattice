name: Native

on:
  push:
    paths:
      - 'lattice-native/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'lattice-native/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gcc
            runner: ubuntu-latest
            cxx: g++
            cc: gcc
            artifact: liblattice.so
            artifact_path: lattice-native/build/liblattice.so
          - name: linux-x86_64-clang
            runner: ubuntu-latest
            cxx: clang++
            cc: clang
            artifact: liblattice.clang.so
            artifact_path: lattice-native/build/liblattice.so
          - name: linux-aarch64-clang-cross
            runner: ubuntu-latest
            cxx: clang++
            cc: clang
            artifact: liblattice.linux-aarch64.so
            build_dir: lattice-native/build-linux-aarch64
            artifact_path: lattice-native/build-linux-aarch64/liblattice.so
            cross_compile: true
            build_tests: OFF
            packages: g++-aarch64-linux-gnu
            cmake_args: >-
              -DCMAKE_SYSTEM_NAME=Linux
              -DCMAKE_SYSTEM_PROCESSOR=aarch64
              -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu
              -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu
              -DCMAKE_C_COMPILER_EXTERNAL_TOOLCHAIN=/usr
              -DCMAKE_CXX_COMPILER_EXTERNAL_TOOLCHAIN=/usr
          - name: windows-x86_64-msvc
            runner: windows-latest
            cxx: cl
            cc: cl
            artifact: lattice.dll
            build_dir: lattice-native/build-windows
            artifact_path: lattice-native/build-windows/lattice.dll
          - name: windows-x86_64-clang-cl
            runner: windows-latest
            cxx: clang-cl
            cc: clang-cl
            artifact: lattice.clang.dll
            build_dir: lattice-native/build-windows-clang
            artifact_path: lattice-native/build-windows-clang/lattice.dll
          - name: macos-x86_64-clang
            runner: macos-13
            cxx: clang++
            cc: clang
            artifact: liblattice.macos-x86_64.dylib
            artifact_path: lattice-native/build/liblattice.dylib
          - name: macos-arm64-clang
            runner: macos-14
            cxx: clang++
            cc: clang
            artifact: liblattice.dylib
            artifact_path: lattice-native/build/liblattice.dylib

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.28.3'

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld ${{ matrix.packages }}

      - name: Cache CMake / FetchContent
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.build_dir || 'lattice-native/build' }}/_deps
          key: lattice-native-fetch-${{ matrix.name }}-libdeflate-v1.20
          restore-keys: |
            lattice-native-fetch-${{ matrix.name }}-

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cmake -S lattice-native -B ${{ matrix.build_dir || 'lattice-native/build' }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DLATTICE_WARNINGS_AS_ERRORS=ON \
            -DLATTICE_BUILD_TESTS=${{ matrix.build_tests || 'ON' }} \
            ${{ matrix.cmake_args }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cmake -S lattice-native -B ${{ matrix.build_dir || 'lattice-native/build-windows' }} -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLATTICE_WARNINGS_AS_ERRORS=ON `
            -DLATTICE_BUILD_TESTS=${{ matrix.build_tests || 'ON' }}

      - name: Build
        run: cmake --build ${{ matrix.build_dir || 'lattice-native/build' }} --config Release --parallel

      - name: Run unit tests
        if: matrix.cross_compile != true
        working-directory: ${{ matrix.build_dir || 'lattice-native/build' }}
        run: ctest --output-on-failure -C Release

      - name: Show produced binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          find ${{ matrix.build_dir || 'lattice-native/build' }} -maxdepth 2 -name 'liblattice*' -print -exec file {} \;

      - name: Show produced binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter 'lattice*.dll' ${{ matrix.build_dir || 'lattice-native/build-windows' }} | Format-Table FullName, Length

      - name: Verify symbol JNI_OnLoad is exported (Unix)
        if: runner.os == 'Linux' && matrix.cross_compile != true
        run: |
          nm -D ${{ matrix.build_dir || 'lattice-native/build' }}/liblattice.* | grep -E ' (JNI_OnLoad|Java_com_latticemc_lattice_nativelib_)' | head -20

      - name: Verify symbol JNI_OnLoad is exported (macOS)
        if: runner.os == 'macOS'
        run: |
          nm -gU ${{ matrix.build_dir || 'lattice-native/build' }}/liblattice.* | grep -E '(_JNI_OnLoad|_Java_com_latticemc_lattice_nativelib_)' | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
