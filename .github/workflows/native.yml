name: Native

on:
  push:
    paths: ['lattice-native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['lattice-native/**', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the native-latest GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04, os: linux, arch: x86_64, artifact_path: lattice-native/build/liblattice.so, asset_name: lattice-native-linux-x86_64.so }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, os: linux, arch: aarch64, artifact_path: lattice-native/build/liblattice.so, asset_name: lattice-native-linux-aarch64.so }
          - { name: windows-x86_64, runner: windows-2025, os: windows, arch: x86_64, llvm_mingw_host: x86_64, llvm_mingw_target: x86_64-w64-mingw32, llvm_mingw_sha256: b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35, asset_name: lattice-native-windows-x86_64.dll }
          - { name: windows-aarch64, runner: windows-11-arm, os: windows, arch: aarch64, llvm_mingw_host: aarch64, llvm_mingw_target: aarch64-w64-mingw32, llvm_mingw_sha256: 312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba, asset_name: lattice-native-windows-aarch64.dll }
          - { name: macos-x86_64, runner: macos-15-intel, os: macos, arch: x86_64, artifact_path: lattice-native/build/liblattice.dylib, asset_name: lattice-native-macos-x86_64.dylib }
          - { name: macos-aarch64, runner: macos-15, os: macos, arch: aarch64, artifact_path: lattice-native/build/liblattice.dylib, asset_name: lattice-native-macos-aarch64.dylib }
          - { name: freebsd-x86_64, runner: ubuntu-24.04, os: freebsd, arch: x86_64, artifact_path: lattice-native/build/liblattice.so, asset_name: lattice-native-freebsd-x86_64.so }
          - { name: freebsd-aarch64, runner: ubuntu-24.04, os: freebsd, arch: aarch64, artifact_path: lattice-native/build/liblattice.so, asset_name: lattice-native-freebsd-aarch64.so }

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        if: matrix.os != 'freebsd'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.arch == 'aarch64' && 'aarch64' || 'x64' }}

      - name: Set up CMake
        if: matrix.os != 'freebsd'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.28.3'

      - name: Cache LLVM-MinGW
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/llvm-mingw/20260616/${{ matrix.llvm_mingw_host }}
          key: llvm-mingw-20260616-ucrt-${{ matrix.llvm_mingw_host }}

      - name: Set up LLVM-MinGW
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: '20260616'
          LLVM_MINGW_HOST: ${{ matrix.llvm_mingw_host }}
          LLVM_MINGW_TARGET: ${{ matrix.llvm_mingw_target }}
          LLVM_MINGW_SHA256: ${{ matrix.llvm_mingw_sha256 }}
        run: |
          $installRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-mingw/$env:LLVM_MINGW_VERSION/$env:LLVM_MINGW_HOST"
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot 'bin'))) {
            $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_HOST.zip"
            $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_HOST"
            $assetName = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-$env:LLVM_MINGW_HOST.zip"
            $downloadUrl = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$assetName"
            Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
            $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $env:LLVM_MINGW_SHA256) {
              throw "LLVM-MinGW SHA-256 mismatch: expected $env:LLVM_MINGW_SHA256, got $actualHash"
            }
            Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
            $extractedRoots = @(Get-ChildItem -LiteralPath $extractRoot -Directory | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'bin') })
            if ($extractedRoots.Count -ne 1) {
              throw "Expected one LLVM-MinGW root directory, found $($extractedRoots.Count)"
            }
            Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path (Split-Path -Parent $installRoot) -Force | Out-Null
            Move-Item -LiteralPath $extractedRoots[0].FullName -Destination $installRoot
          }
          $binPath = Join-Path $installRoot 'bin'
          $compiler = Join-Path $binPath "$($env:LLVM_MINGW_TARGET)-clang++.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Missing LLVM-MinGW compiler: $compiler"
          }
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'LLVM-MinGW compiler smoke test failed' }
          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_MINGW_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_MINGW_TARGET=$env:LLVM_MINGW_TARGET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Windows ARM64 Java architecture
        if: matrix.os == 'windows' && matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $arch = (& java -XshowSettings:properties -version 2>&1 | Select-String 'os.arch').ToString()
          if ($arch -notmatch '(?i)(aarch64|arm64)') { throw "Expected ARM64 Java, got: $arch" }

      - name: Install Linux toolchain
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build clang lld

      - name: Configure and build Unix native
        if: matrix.os == 'linux' || matrix.os == 'macos'
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          cmake -S lattice-native -B lattice-native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLATTICE_WARNINGS_AS_ERRORS=ON -DLATTICE_BUILD_TESTS=ON
          cmake --build lattice-native/build --parallel
          ctest --test-dir lattice-native/build --output-on-failure
          file_output="$(file -L "${{ matrix.artifact_path }}")"
          printf '%s\n' "$file_output"
          if [[ '${{ matrix.arch }}' == 'x86_64' ]]; then
            grep -Eqi '(x86[-_ ]64|x86-64)' <<<"$file_output"
          else
            grep -Eqi '(aarch64|arm64)' <<<"$file_output"
          fi

      - name: Configure and build Windows native
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $binPath = Join-Path $env:LLVM_MINGW_ROOT 'bin'
          $cCompiler = (Join-Path $binPath "$($env:LLVM_MINGW_TARGET)-clang.exe").Replace('\', '/')
          $cxxCompiler = (Join-Path $binPath "$($env:LLVM_MINGW_TARGET)-clang++.exe").Replace('\', '/')
          $rcCompiler = (Join-Path $binPath "$($env:LLVM_MINGW_TARGET)-windres.exe").Replace('\', '/')
          $configureArgs = @(
            '-S', 'lattice-native',
            '-B', 'lattice-native/build-windows',
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}",
            "-DCMAKE_C_COMPILER=$cCompiler",
            "-DCMAKE_CXX_COMPILER=$cxxCompiler",
            "-DCMAKE_RC_COMPILER=$rcCompiler",
            '-DLATTICE_WARNINGS_AS_ERRORS=ON',
            '-DLATTICE_BUILD_TESTS=ON'
          )
          & cmake @configureArgs
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          & cmake --build lattice-native/build-windows --parallel
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
          & ctest --test-dir lattice-native/build-windows --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed' }
          $artifacts = @(Get-ChildItem -LiteralPath 'lattice-native/build-windows' -Recurse -File -Filter '*lattice*.dll')
          if ($artifacts.Count -ne 1) {
            Get-ChildItem -LiteralPath 'lattice-native/build-windows' -Recurse -File -Filter '*.dll' | Select-Object -ExpandProperty FullName
            throw "Expected exactly one Lattice DLL, found $($artifacts.Count)"
          }
          $artifactPath = $artifacts[0].FullName
          "WINDOWS_ARTIFACT_PATH=$artifactPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $readObj = Join-Path $binPath 'llvm-readobj.exe'
          $headers = & $readObj --file-headers $artifactPath 2>&1
          if ($LASTEXITCODE -ne 0) { throw "llvm-readobj failed for $artifactPath" }
          $headers
          $headerText = $headers -join "`n"
          if ('${{ matrix.arch }}' -eq 'x86_64') {
            if ($headerText -notmatch 'IMAGE_FILE_MACHINE_AMD64') { throw 'Expected x64 PE library' }
          } elseif ($headerText -notmatch 'IMAGE_FILE_MACHINE_ARM64') {
            throw 'Expected ARM64 PE library'
          }

      - name: Build in FreeBSD VM
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@5d765136e46232e8764d505d6b57e123f2ba7f45
        with:
          release: '14.4'
          arch: ${{ matrix.arch == 'aarch64' && 'aarch64' || 'amd64' }}
          usesh: true
          sync: rsync
          # Cache FreeBSD packages after provisioning; cache invalidates when this setup changes.
          prepare: |
            pkg install -y cmake ninja git openjdk21 pkgconf libdeflate file
          cache-after-prepare: true
          run: |
            set -eux
            if [ '${{ matrix.arch }}' = 'x86_64' ]; then
              test "$(uname -m)" = 'amd64'
              build_tests=ON
            else
              case "$(uname -m)" in
                aarch64|arm64) ;;
                *) echo "Expected FreeBSD ARM64, got $(uname -m)" >&2; exit 1 ;;
              esac
              # Linux ARM covers native/NEON tests; this VM verifies FreeBSD ARM ABI and build output.
              build_tests=OFF
            fi
            export JAVA_HOME=/usr/local/openjdk21
            test -f "$JAVA_HOME/include/jni.h"
            test -f "$JAVA_HOME/include/freebsd/jni_md.h"
            cmake -S lattice-native -B lattice-native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLATTICE_WARNINGS_AS_ERRORS=ON -DLATTICE_BUILD_TESTS="$build_tests"
            cmake --build lattice-native/build --parallel
            if [ "$build_tests" = 'ON' ]; then
              ctest --test-dir lattice-native/build --output-on-failure
            fi
            file_output="$(file -L '${{ matrix.artifact_path }}')"
            printf '%s\n' "$file_output"
            if [ '${{ matrix.arch }}' = 'x86_64' ]; then
              printf '%s\n' "$file_output" | grep -Eqi '(x86[-_ ]64|x86-64)'
            else
              printf '%s\n' "$file_output" | grep -Eqi '(aarch64|arm64)'
            fi

      - name: Stage canonical release asset (Unix)
        if: matrix.os != 'windows'
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          SOURCE_PATH: ${{ matrix.artifact_path }}
        run: |
          set -euo pipefail
          staging_dir="$RUNNER_TEMP/lattice-native-release"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"
          cp -L "$SOURCE_PATH" "$staging_dir/$ASSET_NAME"
          (cd "$staging_dir" && sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256")

      - name: Stage canonical release asset (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          SOURCE_PATH: ${{ env.WINDOWS_ARTIFACT_PATH }}
        run: |
          $stagingDir = Join-Path $env:RUNNER_TEMP 'lattice-native-release'
          Remove-Item -LiteralPath $stagingDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stagingDir | Out-Null
          $assetPath = Join-Path $stagingDir $env:ASSET_NAME
          Copy-Item -LiteralPath $env:SOURCE_PATH -Destination $assetPath
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:ASSET_NAME)" | Set-Content -LiteralPath "$assetPath.sha256" -NoNewline

      - name: Upload canonical release artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-publish-${{ matrix.name }}
          path: ${{ runner.temp }}/lattice-native-release
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download canonical release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-publish-*
          path: release-assets
          merge-multiple: true

      - name: Validate canonical release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            lattice-native-linux-x86_64.so lattice-native-linux-aarch64.so
            lattice-native-windows-x86_64.dll lattice-native-windows-aarch64.dll
            lattice-native-macos-x86_64.dylib lattice-native-macos-aarch64.dylib
            lattice-native-freebsd-x86_64.so lattice-native-freebsd-aarch64.so
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          (( ${#actual[@]} == 16 )) || { printf 'Expected exactly 16 release files, found %s\n' "${#actual[@]}" >&2; exit 1; }
          for asset in "${expected[@]}"; do
            [[ -f "release-assets/$asset" && -f "release-assets/$asset.sha256" ]] || { echo "Missing $asset or checksum" >&2; exit 1; }
            (cd release-assets && sha256sum --check --status "$asset.sha256") || { echo "Checksum mismatch: $asset" >&2; exit 1; }
          done
          while IFS= read -r file; do
            base="${file##*/}"
            case "$base" in
              lattice-native-linux-x86_64.so|lattice-native-linux-x86_64.so.sha256|lattice-native-linux-aarch64.so|lattice-native-linux-aarch64.so.sha256|lattice-native-windows-x86_64.dll|lattice-native-windows-x86_64.dll.sha256|lattice-native-windows-aarch64.dll|lattice-native-windows-aarch64.dll.sha256|lattice-native-macos-x86_64.dylib|lattice-native-macos-x86_64.dylib.sha256|lattice-native-macos-aarch64.dylib|lattice-native-macos-aarch64.dylib.sha256|lattice-native-freebsd-x86_64.so|lattice-native-freebsd-x86_64.so.sha256|lattice-native-freebsd-aarch64.so|lattice-native-freebsd-aarch64.so.sha256) ;;
              *) echo "Unexpected release file: $base" >&2; exit 1 ;;
            esac
          done < <(find release-assets -maxdepth 1 -type f)

      - name: Publish immutable native release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Lattice Native (${{ github.sha }})
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish native-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-latest
          name: Lattice Native (latest)
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
