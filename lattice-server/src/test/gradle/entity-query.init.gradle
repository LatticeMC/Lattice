gradle.projectsEvaluated {
    def server = gradle.rootProject.project(':lattice-server')
    server.tasks.register('entityQueryAuditBenchmark', JavaExec) {
        dependsOn server.tasks.named('testClasses')
        classpath = server.sourceSets.test.runtimeClasspath
        mainClass = 'com.latticemc.lattice.nativelib.EntityQueryAuditBenchmark'
        jvmArgs '--enable-preview'
        systemProperty 'lattice.native.path', server.findProperty('entityAuditNativePath') ?:
                gradle.rootProject.file('build/lattice-native/lattice.dll').absolutePath
        systemProperty 'lattice.native.download', 'false'
        systemProperty 'lattice.verify', 'false'
        systemProperty 'entityAudit.warmup', server.findProperty('entityAudit.warmup') ?: '16'
        systemProperty 'entityAudit.samples', server.findProperty('entityAudit.samples') ?: '21'
        systemProperty 'entityAudit.rounds', server.findProperty('entityAudit.rounds') ?: '256'
    }
}
